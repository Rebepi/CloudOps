name: Local integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_AWS: "false"
      RUN_AWS_SMOKE_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Repository publication hygiene
        run: python3 infra/check_git_files.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Backend checks and contracts
        run: docker compose --profile test run --build --rm test
      - name: Start local stack
        run: docker compose up -d --build --wait --wait-timeout 180 api worker frontend
      - name: Browser integration
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Local diagnostics on failure
        if: failure()
        run: docker compose logs --tail 100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down
