<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="logo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="logo-cloud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="logo-cloud-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="logo-aws" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="logo-cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="logo-cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="logo-cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <radialGradient id="logo-glow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#logo-bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="none" stroke="url(#logo-border)" stroke-width="1.5"/>

  <circle cx="32" cy="29" r="16" fill="url(#logo-glow)"/>

  <path d="M 20.5 34 C 16.5 34 13.8 30.5 14.8 26.5 C 15.6 22.8 19 21.2 22.5 21.4 C 24 16.8 28.5 14.2 33.5 14.6 C 38.2 15 42 18.5 43.2 23.2 C 46.8 23.8 49.8 26.8 49.2 30.8 C 48.8 34 45.8 35 42 35"
        fill="url(#logo-cloud-fill)"
        stroke="url(#logo-cloud)"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <line x1="20.5" y1="34" x2="26" y2="31.2" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5 2" opacity="0.8"/>
  <line x1="42" y1="35" x2="38" y2="31.2" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5 2" opacity="0.8"/>
  <line x1="33.5" y1="15" x2="32" y2="21" stroke="#60a5fa" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="1.5 2" opacity="0.6"/>

  <g transform="translate(32, 28)">
    <polygon points="0,-7 6.2,-3.4 0,0.2 -6.2,-3.4" fill="url(#logo-cube-top)"/>
    <polygon points="-6.2,-3.4 0,0.2 0,7.4 -6.2,3.8" fill="url(#logo-cube-left)"/>
    <polygon points="6.2,-3.4 0,0.2 0,7.4 6.2,3.8" fill="url(#logo-cube-right)"/>
    <circle cx="0" cy="0.2" r="1.3" fill="#ffffff" opacity="0.95"/>
  </g>

  <path d="M 17 41.5 C 24 48 39.5 48 46.5 41.5"
        fill="none"
        stroke="url(#logo-aws)"
        stroke-width="2.6"
        stroke-linecap="round"/>
  <path d="M 42.5 42 L 47 41.2 L 44.2 37.2"
        fill="none"
        stroke="url(#logo-aws)"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <circle cx="16.8" cy="41.5" r="2.2" fill="#ff9900"/>
  <circle cx="14.6" cy="26.5" r="1.6" fill="#38bdf8"/>
  <circle cx="49" cy="30.6" r="1.6" fill="#818cf8"/>
  <circle cx="33.5" cy="14.8" r="1.8" fill="#60a5fa"/>
</svg>