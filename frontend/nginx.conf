server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header Host $host;
    }
    location /health/ {
        proxy_pass http://api:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
